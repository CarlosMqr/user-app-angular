@if (users.length == 0) {
    <div class="alert alert-warning"> No hay usuarios registrados</div>
} @else {
<table class="table table-hover table-striped table-bordered shadow">
    <thead>
        <tr>
            <th>id</th>
            <th>name</th>
            <th>lastname</th>
            <th>email</th>
            <th>username</th>
             <th>acciones</th>
        </tr>
    </thead>
    <tbody>
        @for (user of users; track $index) {
        <tr>
            <td>{{ user.id }}</td>
            <td>{{ user.name }}</td>
            <td>{{ user.lastname }}</td>
            <td>{{ user.email }}</td>
            <td>{{ user.username }}</td>

            <td> 
                <select
                        class="form-select form-select-sm"
                        [(ngModel)]="selectedActions[user.id]"
                        [class.bg-success]="selectedActions[user.id] === 'crear'"
                        [class.bg-primary]="selectedActions[user.id] === 'buscar'"
                        [class.bg-info]="selectedActions[user.id] === 'buscarPorUsername'"
                        [class.bg-warning]="selectedActions[user.id] === 'editar'"
                        [class.bg-danger]="selectedActions[user.id] === 'eliminar'"

                        [class.text-white]="
                        selectedActions[user.id] === 'crear' ||
                        selectedActions[user.id] === 'buscar' ||
                        selectedActions[user.id] === 'buscarPorUsername' ||
                        selectedActions[user.id] === 'eliminar'
                        ">

                        <option value="">
                            Seleccionar
                        </option>

                        <option value="crear">
                            Crear
                        </option>

                        <option value="buscar">
                            Buscar
                        </option>

                        <option value="buscarPorUsername">
                            Buscar por userName
                        </option>

                        <option value="editar">
                            Editar
                        </option>

                        <option value="eliminar">
                            Eliminar
                        </option>

                    </select>

                  <button class="btn btn-primary btn-sm mt-1">
                    Ir
                 </button>
           
            </td>
        </tr>
        }
    </tbody>
</table>
}
