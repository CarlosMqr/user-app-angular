@if (users.length == 0) {
    <div class="alert alert-warning"> No hay usuarios registrados</div>
} @else {
<table class="table table-hover table-striped table-bordered shadow">
    <thead>
        <tr>
            <th>name</th>
            <th>lastname</th>
            <th>email</th>
            <th>username</th>
            <th>remove</th>
            <th>update</th>
        </tr>
    </thead>
    <tbody>
        @for (user of users; track $index) {
        <tr>
            <td>{{ user.name }}</td>
            <td>{{ user.lastname }}</td>
            <td>{{ user.email }}</td>
            <td>{{ user.username }}</td>
            <td>
                <button class="btn btn-danger btn-sm" (click)="onRemoveUser(user.id)">
                    remove
                </button>
            </td>

            <td>
                <button class="btn btn-warning btn-sm" (click)="onSelectUser(user)">
                    update
                </button>
            </td>
        </tr>
        }
    </tbody>
</table>
}
